services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: site_audit
      POSTGRES_PASSWORD: site_audit
      POSTGRES_USER: site_audit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_audit -d site_audit"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
